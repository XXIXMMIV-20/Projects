services:
     postgres:
       image: postgres:16-alpine
       container_name: rag_postgres
       restart: unless-stopped
       environment:
         POSTGRES_USER: postgres
         POSTGRES_PASSWORD: postgres123
         POSTGRES_DB: rag_knowledge_db
       ports:
         - "5432:5432"
       volumes:
         - postgres_data_v3:/var/lib/postgresql/data
   
volumes:
  postgres_data_v3: